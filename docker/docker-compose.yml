# Local infrastructure for development. Start with:
#   docker compose -f docker/docker-compose.yml up -d
# Stop with `down` (data is kept in the named volume); `down -v` also deletes the data.
name: rag-eval-platform

services:
  chroma:
    # Pinned to the same version as the chromadb-client Python package.
    image: chromadb/chroma:1.5.9
    ports:
      # Host port 8001, so 8000 stays free for the FastAPI app.
      - "127.0.0.1:${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chroma-admin:
    # Optional web UI for browsing Chroma (community project: github.com/flanker/chromadb-admin).
    # Start with: docker compose -f docker/docker-compose.yml --profile ui up -d
    # Open http://localhost:3001 and connect to http://chroma:8000
    # (tenant default_tenant, database default_database).
    image: fengzhichao/chromadb-admin:0.0.2
    profiles: ["ui"]
    ports:
      - "127.0.0.1:${CHROMA_ADMIN_HOST_PORT:-3001}:3001"
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

  api:
    # The RAG API (Phase 6). Start with:
    #   docker compose -f docker/docker-compose.yml --profile api up -d --build
    # Ollama runs natively on the host (GPU); the container reaches it through
    # host.docker.internal. Seed Chroma first (scripts/seed_vector_store.py).
    image: rag-eval-api  # the same tag as `docker build -f docker/Dockerfile -t rag-eval-api .`
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["api"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    # The repository's .env (API key, models, top-k...) reaches the container; the values
    # below override the ones that must differ inside Docker.
    env_file:
      - path: ../.env
        required: false
    environment:
      RAG_CHROMA_HOST: chroma
      RAG_CHROMA_PORT: "8000"
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      RAG_API_HOST: 0.0.0.0
      RAG_API_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma-data:
