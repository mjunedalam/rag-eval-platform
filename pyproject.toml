[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-platform"
version = "0.1.0"
description = "End-to-end RAG pipeline with automated evaluation and CI/CD gating."
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "chromadb-client==1.5.9",
    "fonttools>=4.66.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]
openai = [
    # 2.x is enough for our calls; newer 3.x needs a jiter that ragas' instructor rejects.
    "openai>=2.0.0",
]
# Generation evaluation: RAGAS metrics and DeepEval pytest checks, scored by an LLM judge.
evaluation = [
    "deepeval>=4.2.6",
    "ragas>=0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2.
    "langchain-community<0.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_platform"]

# Linux (CI, Docker) gets CPU-only PyTorch; the default CUDA wheels are several GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]
ui = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rag_eval_platform"]
strict = true
plugins = ["pydantic.mypy"]

# Optional embedding backends are not installed in CI; skip them locally too so both
# environments type-check the same code. Our code talks to them through Protocols.
[[tool.mypy.overrides]]
module = [
    "sentence_transformers", "sentence_transformers.*", "openai", "openai.*",
    "streamlit", "streamlit.*", "plotly", "plotly.*",
    "ragas", "ragas.*", "deepeval", "deepeval.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Streamlit is skipped above, so its cache decorators look untyped to mypy.
[[tool.mypy.overrides]]
module = [
    "rag_eval_platform.playground.app", "rag_eval_platform.playground.shared",
    "rag_eval_platform.playground.tabs.*",
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p no:deepeval"
markers = [
    "integration: tests that need external services (vector store, network)",
    "evaluation: golden-dataset evaluation and threshold checks",
]

[tool.coverage.run]
source = ["rag_eval_platform"]
branch = true
# Drawing code; its logic lives in core.py, visuals.py and query_visuals.py (unit-tested).
# charts.py is tested when Plotly is installed, which CI does not do.
omit = [
    "*/playground/app.py", "*/playground/shared.py", "*/playground/tabs/*",
    "*/playground/charts.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
