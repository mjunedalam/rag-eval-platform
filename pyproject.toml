[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-platform"
version = "0.1.0"
description = "End-to-end RAG pipeline with automated evaluation and CI/CD gating."
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]
openai = [
    "openai>=3.19.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_platform"]

# Linux (CI, Docker) gets CPU-only PyTorch; the default CUDA wheels are several GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rag_eval_platform"]
strict = true
plugins = ["pydantic.mypy"]

# Optional embedding backends are not installed in CI; skip them locally too so both
# environments type-check the same code. Our code talks to them through Protocols.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "openai", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need external services (vector store, network)",
    "evaluation: golden-dataset evaluation and threshold checks",
]

[tool.coverage.run]
source = ["rag_eval_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
